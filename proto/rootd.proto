syntax = "proto3";

// Control protocol between the app and wingsvd, the optional root helper daemon
// shipped as a Magisk/KernelSU/APatch module.
//
// Framing is a big-endian uint32 length prefix followed by one encoded message,
// capped at 1 MiB - the same wire vpnhotspotd uses (DaemonIpc.kt / control/wire.rs).
// Transport is an abstract AF_UNIX socket the daemon listens on; the daemon
// authenticates each client by SO_PEERCRED, so nothing here carries a token.
//
// Routing is described structurally rather than as a shell script on purpose: the
// daemon has to be able to tear a session down by itself, long after the app that
// asked for it is gone, and it can only do that if it knows what it installed.
package wingsv.rootd;

option java_package = "wings.v.proto";
option java_outer_classname = "RootdProto";
option optimize_for = LITE_RUNTIME;

message ClientEnvelope {
  uint64 call_id = 1;
  oneof command {
    HelloCommand hello = 2;
    ApplyRoutingCommand apply_routing = 3;
    ClearRoutingCommand clear_routing = 4;
    SessionStateCommand session_state = 5;
    SpawnChildCommand spawn_child = 6;
    KillChildCommand kill_child = 7;
    ReadCountersCommand read_counters = 8;
    ReadNetDevCommand read_net_dev = 9;
    ApplyForwardedRedirectCommand apply_forwarded_redirect = 10;
    ApplyForwardedExclusionCommand apply_forwarded_exclusion = 11;
  }
}

message DaemonEnvelope {
  uint64 call_id = 1;
  oneof frame {
    ReplyFrame reply = 2;
    ErrorFrame error = 3;
  }
}

message ReplyFrame {
  oneof payload {
    HelloReply hello = 1;
    Ack ack = 2;
    SessionState session_state = 3;
    ChildHandle child = 4;
    Counters counters = 5;
    NetDev net_dev = 6;
  }
}

message ErrorFrame {
  string message = 1;
}

message Ack {}

// Sent before anything else. A daemon older than the app - or newer - answers with
// its own range and the app then refuses to use it and warns the user, rather than
// speaking a protocol neither side agreed on.
message HelloCommand {
  uint32 protocol_version = 1;
  string app_version = 2;
}

message HelloReply {
  uint32 protocol_version = 1;
  // Oldest client protocol this daemon still accepts. Additive fields do not move
  // either number; changed semantics move both.
  uint32 min_supported = 2;
  string module_version = 3;
  repeated string caps = 4;
}

// The variable half of the root routing. The fixed half (rule priorities, table
// ids, chain names) travels too rather than being duplicated as constants in both
// the app and the daemon, where the two copies could drift apart silently.
message RoutingSpec {
  string tunnel_name = 1;
  uint32 app_uid = 2;

  // Sanitized "default ..." lines, ready for `ip route add`. The app resolves them
  // from the main table because only it knows which network is the underlying one.
  repeated string ipv4_default_routes = 3;
  repeated string ipv6_default_routes = 4;

  uint32 upstream_table = 5;
  uint32 rule_priority_start = 6;
  uint32 rule_priority_end = 7;
  uint32 app_tunnel_priority = 8;
  // Apps that must egress around the tunnel; one ip rule each, from
  // rule_priority_start + 1 upwards.
  repeated uint32 bypass_uids = 9;

  // Re-marks bypassed apps' packets with the underlying network's fwmark. Without
  // it they keep the tunnel netId mark and the cellular uplink drops them.
  bool bypass_mark_enabled = 10;
  string bypass_mark_chain = 11;
  uint32 bypass_mark_fwmark = 12;

  // Sharing DHCP workaround: `ip rule add iif lo uidrange 0-0 lookup 97`.
  bool dhcp_workaround_enabled = 13;
  uint32 dhcp_workaround_priority = 14;

  optional TproxySpec tproxy = 15;
}

message TproxySpec {
  uint32 port = 1;
  uint32 fwmark = 2;
  uint32 route_table = 3;
  uint32 rule_priority = 4;
  AppRoutingMode app_mode = 5;
  repeated uint32 routed_uids = 6;
  // Mangle chains holding the MARK rules whose byte counters are the exact TX. The
  // app still installs these chains itself, so it names them here rather than the
  // daemon assuming them - two hardcoded copies would drift apart silently.
  repeated string mark_chains = 7;
}

enum AppRoutingMode {
  APP_ROUTING_MODE_ALL = 0;
  APP_ROUTING_MODE_ONLY_SELECTED = 1;
  APP_ROUTING_MODE_EXCEPT_SELECTED = 2;
}

message ApplyRoutingCommand {
  RoutingSpec spec = 1;
}

message ClearRoutingCommand {}

// The forwarded-client carve-outs for VPN sharing. They were the last piece of the
// tethering routing still applied over su - the app-owned half, not the vendored
// masquerade engine - so a killed app stranded them with no owner to reassert or
// clear. The daemon keeps the last spec of each so it can hold the carve-out up past
// the app, and tear it down by itself on clear. Both are keyed on the live downstream
// interface set; an empty set clears the carve-out.

// Redirects forwarded (hotspot/usb client) traffic on the named downstream interfaces
// into the local dokodemo-door redirect inbound, so shared clients egress through the
// active outbound rather than the physical upstream (nat chain WINGS_XRAY_REDIR, IPv4
// only). Port 0 or an empty interface set clears it.
message ForwardedRedirectSpec {
  repeated string downstream_interfaces = 1;
  uint32 redirect_port = 2;
}

message ApplyForwardedRedirectCommand {
  ForwardedRedirectSpec spec = 1;
}

// Carves forwarded traffic out of the on-device tproxy so it is not tunneled unless
// the user turned sharing on (mangle chain WINGS_XRAY_TP_FWD jumped first into the
// tproxy PREROUTING chain named here). With dns_only set only the clients' udp/53 is
// carved out and the rest stays tunneled; without it all forwarded traffic from the
// interfaces goes direct. An empty interface set clears it.
message ForwardedExclusionSpec {
  repeated string downstream_interfaces = 1;
  bool dns_only = 2;
  string tproxy_pre_chain = 3;
}

message ApplyForwardedExclusionCommand {
  ForwardedExclusionSpec spec = 1;
}

message SessionStateCommand {}

// What the daemon believes is installed right now. This is the authoritative answer
// the app reconciles against when it comes back from being killed, and what the QS
// tile shows instead of the app's own MMKV snapshot, which goes stale the moment the
// app dies.
message SessionState {
  bool routing_active = 1;
  // True once the client that asked for this session went away without clearing it.
  // The session is deliberately kept: a killed app is usually the low-memory killer
  // rather than a user who wanted the VPN off.
  bool orphaned = 2;
  string tunnel_name = 3;
  repeated ChildHandle children = 4;
  // Whether the app is holding a connection right now. Distinct from routing_active:
  // the tunnel can be up while the app is gone, which is the whole point of orphaned
  // sessions, and the module's web ui has to show those two facts separately.
  bool app_connected = 5;
  // Bytes matched by the tproxy mark rule, so a status page does not need a second
  // round trip for the one number worth showing.
  uint64 tproxy_mark_bytes = 6;
}

// Only binaries the daemon recognises may be started; the app names one rather than
// handing over an argv, so a client that got past the uid check still cannot use the
// daemon as a general-purpose root exec.
enum ChildKind {
  CHILD_KIND_UNSPECIFIED = 0;
  CHILD_KIND_XRAY = 1;
  CHILD_KIND_VKTURN = 2;
  CHILD_KIND_BYEDPI = 3;
}

message SpawnChildCommand {
  ChildKind kind = 1;
  // For kinds that are a plain executable (vkturn): its path inside the app's
  // nativeLibraryDir, which the daemon verifies before exec.
  string binary_path = 2;
  repeated string args = 3;
  string working_dir = 4;

  // For kinds that run inside app_process (byedpi, xray): the app's apk for the
  // CLASSPATH and its native library dir.
  //
  // The entry class is NOT taken from here - the daemon pins it. A client that named
  // its own class would be asking the daemon to run arbitrary code as root, which is
  // precisely what the uid check is not meant to be the only guard against.
  string classpath = 5;
  string lib_dir = 6;
}

message ChildHandle {
  ChildKind kind = 1;
  uint64 child_id = 2;
  int32 pid = 3;
  bool running = 4;
}

message KillChildCommand {
  uint64 child_id = 1;
}

message ReadCountersCommand {}

message Counters {
  // Bytes matched by the tproxy mark rule; exact, and free of the 1 Hz throttle the
  // app has to live with when it shells out for them itself.
  uint64 tproxy_mark_bytes = 1;
}

// Reads /proc/net/dev on the app's behalf. Android 16 tightened SELinux so the app's
// own untrusted_app process is denied that read, which killed the speed graph and
// per-interface traffic accounting in root/tproxy mode; the daemon reads it in its
// permitted context and hands back the raw text for the app to parse. See issue #76.
message ReadNetDevCommand {}

message NetDev {
  // Verbatim /proc/net/dev contents; the app already parses this format, so the
  // daemon does not duplicate the column parsing.
  string content = 1;
}
