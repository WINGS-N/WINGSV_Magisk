name: release

# Publishes the flashable module on a v* tag, plus the module-update.json that
# module.prop's updateJson points at - that file is what makes KernelSU / Magisk offer
# the update in their manager, so it has to be published with the zip rather than by
# hand afterwards.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up the Android Rust toolchain
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - name: Version
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="0.0.0"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # module.prop is the source of truth for versionCode; the manager compares it
          # numerically to decide whether an update exists.
          echo "code=$(sed -n 's/^versionCode=//p' module.prop)" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches module.prop
        run: |
          prop="$(sed -n 's/^version=//p' module.prop)"
          # A tag that disagrees with module.prop would ship a zip the manager thinks is
          # a different version than the release says - fail loudly instead.
          [ "$prop" = "v${{ steps.v.outputs.version }}" ] || {
            echo "module.prop version=$prop does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          }

      - name: Build the module
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/ndk
        run: |
          # The runner image ships an NDK; point the build at it rather than downloading.
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          ln -s "$ANDROID_NDK_LATEST_HOME" "$ANDROID_NDK_HOME"
          ./build-module.sh dist
          sha256sum dist/wingsv-root-module.zip | cut -d' ' -f1 > dist/wingsv-root-module.zip.sha256

      - name: Write module-update.json
        run: |
          cat > dist/module-update.json <<EOF
          {
            "version": "v${{ steps.v.outputs.version }}",
            "versionCode": ${{ steps.v.outputs.code }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/wingsv-root-module.zip",
            "changelog": "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          }
          EOF
          cat dist/module-update.json

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/wingsv-root-module.zip
            dist/wingsv-root-module.zip.sha256
            dist/module-update.json
